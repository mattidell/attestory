<!doctype html>
<!--
  Presentation — Citation Walk. The PRODUCT surface: this page is served to the
  owner during a live viewing session and renders their real presentation model.

  Consumes a frozen presentation-model.v1 object shaped from form-field.v3 +
  act-derived-publication.v1 instances (ADR-0046 Presentation Surface Contract)
  and renders the line -> subtotal -> per-source disposition -> citation pin ->
  source fact walk. The model is substituted into __MODEL_JSON__ by
  packages/derivation/live_session.py, read from the live workspace.

  This file makes NO claim about the provenance of what it renders, and must
  not acquire one: it is served with real data during a session and with
  synthetic data during a rehearsal, and a page cannot verify which it holds.
  Asserting either way would be a claim the surface cannot support.

  A near-identical copy lives at
  tools/presentation_harness/examples/pages/citation-walk.v1.html. That one is
  an evaluation fixture, is synthetic-only by declaration, and is a frozen
  evaluation baseline. The two are deliberately separate: the evaluation copy
  must be free to say it is synthetic, and this one must never say anything.
  A change to the walk itself belongs in both.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Form 1040 — Citation Walk</title>
<style>
  :root {
    --bg:#ffffff;
    --text:#1a1a1a;
    --link:#0b3d91;
    --published-bg:#1b5e20;
    --zero-bg:#37474f;
    --blocked-bg:#7a0000;
    --guard-bg:#4a4a4a;
    --border:#555555;
    --focus:#000000;
    --detail-bg:#f4f4f4;
    --error-bg:#fff3f3;
    --error-border:#7a0000;
    --diag-bg:#f0f4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; line-height:1.5; }
  .skip-link { position:absolute; left:-999px; top:0; background:var(--link); color:#fff; padding:.5rem 1rem; z-index:100; }
  .skip-link:focus { left:.5rem; top:.5rem; }
  header[role="banner"] { padding:1rem 1.25rem; border-bottom:2px solid var(--border); }
  header h1 { margin:0 0 .25rem; font-size:1.4rem; }
  main { padding:1.25rem; max-width:56rem; margin:0 auto; }
  section.line { margin-bottom:1.5rem; border:1px solid var(--border); border-radius:8px; padding:1rem 1.25rem; }
  section.line h2 { margin-top:0; font-size:1.15rem; }
  h3 { font-size:1rem; margin-bottom:.4rem; }
  .badge { display:inline-block; font-weight:700; font-size:.78rem; letter-spacing:.03em;
    padding:.2rem .55rem; border-radius:999px; color:#fff; text-transform:uppercase; }
  .badge.published_value, .badge.computed_zero, .badge.closure_backed_zero { background:var(--published-bg); }
  .badge.blocked { background:var(--blocked-bg); }
  .badge.guard_inapplicable { background:var(--guard-bg); }
  .line-value { font-size:1.6rem; font-weight:700; margin:.35rem 0; }
  .line-value.blocked-value, .line-value.guard-value { font-size:1.05rem; font-weight:600; }
  .explain { font-size:.9rem; opacity:.9; }

  button.citation { font: inherit; color: var(--link); background: var(--detail-bg);
    border:2px solid var(--link); border-radius:6px; padding:.3rem .6rem; margin:.15rem .25rem .15rem 0;
    cursor:pointer; text-decoration: underline dotted; text-underline-offset: 3px;
    display:inline-flex; align-items:center; gap:.35rem; }
  button.citation:hover { background: var(--link); color:#fff; }
  button.citation:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .citation-detail { margin:.4rem 0 .75rem; padding:.6rem .75rem; background:var(--detail-bg);
    border-left:4px solid var(--link); border-radius:4px; font-size:.92rem; }
  .citation-detail[hidden] { display:none; }
  .citation-detail dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:.15rem .75rem; }
  .citation-detail dt { font-weight:600; }
  .backlink { display:inline-block; margin-top:.4rem; font-style:italic; }
  .backlink::before { content: "\2194 "; font-style:normal; }

  .diagnostic { margin-top:.6rem; padding:.5rem .75rem; background:var(--diag-bg); border-radius:6px; font-size:.9rem; }
  .diagnostic.suppressed { opacity:.85; font-style:italic; }

  section.line.blocked-line { border:3px solid var(--blocked-bg); background: var(--error-bg); }
  .blocked-banner { display:flex; align-items:flex-start; gap:.6rem; }
  .remedy-box { margin-top:.6rem; padding:.6rem .75rem; border:1px dashed var(--blocked-bg); border-radius:6px; }
  .line21-explanation { margin-top:1rem; border-top:1px solid var(--border); padding-top:.75rem; }
  .line21-explanation h3 { margin:.9rem 0 .35rem; }
  .line21-rows { display:grid; gap:.7rem; }
  .line21-row { border:1px solid #777; border-radius:6px; padding:.65rem .75rem; min-width:0; }
  .line21-row p, .line21-working p { margin:.25rem 0; overflow-wrap:anywhere; }
  .line21-row details, .line21-working, .line21-citations { margin-top:.55rem; padding:.55rem .7rem; background:var(--detail-bg); border-radius:5px; }
  .line21-row summary, .line21-working summary, .line21-citations summary { cursor:pointer; font-weight:600; }
  .line21-groups { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.6rem; margin-top:.55rem; }
  .line21-group { min-width:0; padding:.5rem; border:1px solid #777; border-radius:5px; }
  .line21-group h4 { margin:.1rem 0 .35rem; }
  .line21-group ul { margin:.2rem 0; padding-left:1.2rem; }
  .line21-group li { overflow-wrap:anywhere; margin:.2rem 0; }
  .line21-citations .citation-detail dd { margin-left:0; overflow-wrap:anywhere; }
  .line21-citations .citation-detail dl { grid-template-columns:1fr; }
  .line21-account-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.6rem; margin-top:.55rem; }
  .line21-missing-wording { font-style:italic; }
  .line21-run { margin:.75rem 0 .2rem; overflow-wrap:anywhere; }
  @media (max-width: 600px) {
    .line21-groups, .line21-account-groups { grid-template-columns:1fr; }
    .line21-group { padding:.45rem; }
  }

  .section-error { border:2px solid var(--error-border); background:var(--error-bg); padding:.6rem .75rem; border-radius:6px; font-weight:600; }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<header role="banner">
  <h1 id="page-heading">Form 1040 — Citation Walk</h1>
  <p>Every figure below is projected from a cited source fact. Nothing on this
  page is computed here.</p>
</header>

<main id="main">
  <div id="sections-root"></div>
  <div id="attachment-status-root"></div>
  <div id="citation-groups-root"></div>
  <div id="diagnostics-root"></div>
</main>

<script>
"use strict";

/* ============================================================
   Model load. MODEL is the sole numeric/authority source
   for this render (ADR-0046 Requirement 1: zero-authority
   projection) — nothing on this page is computed from anything
   else. Frozen immediately so no later code path can mutate it.
   ============================================================ */
const MODEL = Object.freeze(__MODEL_JSON__);

const KNOWN_DISPOSITIONS = Object.freeze(["published_value", "computed_zero", "closure_backed_zero", "published_categorical"]);
const NUMERIC_DISPOSITIONS = new Set(["published_value", "computed_zero", "closure_backed_zero"]);
const PRESENTED_DISPOSITIONS = new Set(KNOWN_DISPOSITIONS);

/* Safe DOM construction only — no innerHTML anywhere on this page
   (ADR-0046 foreclosure 5). */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null) continue;
      if (k === "className") node.className = v;
      else node.setAttribute(k, v);
    }
  }
  for (const child of children || []) {
    if (child === undefined || child === null) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

/* Reason codes are the ONLY thing an error banner may show. Never the
   thrown message, never any model-derived text — that is what makes
   redaction (ADR-0046 foreclosure 6) structural rather than a discipline
   someone could forget under a new disposition kind. */
const REASON_TEXT = Object.freeze({
  "unrecognized-disposition": "This line named a disposition this renderer does not recognize. No value can be shown safely.",
  "invalid-numeric-value": "This line's published value failed validation. No value can be shown safely.",
  "missing-instruction": "This line is missing its rendering instruction for the declared disposition.",
  "missing-field-citation": "This line published a value with no citation attached. No value can be shown safely.",
  "unrecognized-attachment-code": "This attachment named a condition code this renderer does not recognize. No detail can be shown safely.",
  "malformed-line21-explanation": "This section's saved explanation could not be displayed safely.",
  "unknown-error": "This section failed to render safely.",
});

class SectionError extends Error {
  constructor(reasonCode) {
    super(reasonCode);
    this.reasonCode = REASON_TEXT[reasonCode] ? reasonCode : "unknown-error";
  }
}

/* ============================================================
   Citation registry. Built once, from every citationSites array
   across every section and citation group, keyed by pin identity
   (id@version) — never by siteId. Every citation button for the
   same pin therefore reads the exact same canonical record: reuse
   identity is enforced structurally, not by the model author
   remembering to repeat matching text (ADR-0046 Requirement 5).
   ============================================================ */
function fieldCitationSiteId(sectionId) {
  return sectionId + "-field-citation";
}

const SITES_BY_PIN = {};
const ALL_CITATION_SITES = [];
for (const section of MODEL.sections || []) {
  for (const site of section.citationSites || []) ALL_CITATION_SITES.push(site);
  const disposition = section.resolved && section.resolved.disposition;
  const citation = section.field && section.field.citation;
  if (PRESENTED_DISPOSITIONS.has(disposition) && citation && citation.id && citation.version) {
    ALL_CITATION_SITES.push({
      siteId: fieldCitationSiteId(section.id),
      pinId: citation.id,
      pinVersion: citation.version,
      context: (section.field && section.field.label) || section.id,
    });
  }
}
for (const group of MODEL.citationGroups || []) {
  for (const part of group.parts || []) {
    for (const site of part.citationSites || []) ALL_CITATION_SITES.push(site);
  }
}
for (const site of ALL_CITATION_SITES) {
  const key = site.pinId + "@" + site.pinVersion;
  (SITES_BY_PIN[key] ||= []).push(site);
}

function pinLabel(pinId, pinVersion) {
  const label = (MODEL.pinLabels || {})[pinId];
  return label || (pinId + "@" + pinVersion);
}

function renderCitation(siteId, pinId, pinVersion) {
  const key = pinId + "@" + pinVersion;
  const siblings = (SITES_BY_PIN[key] || []).filter((s) => s.siteId !== siteId);
  const detailId = siteId + "-detail";

  const button = el("button", {
    type: "button", id: siteId, class: "citation",
    "aria-expanded": "false", "aria-controls": detailId,
    "data-pin-id": pinId, "data-pin-version": pinVersion,
  }, [
    el("span", { class: "citation-label" }, [pinLabel(pinId, pinVersion)]),
  ]);

  const dl = el("dl", null, [
    el("dt", null, ["Pin id"]), el("dd", null, [pinId]),
    el("dt", null, ["Pin version"]), el("dd", null, [pinVersion]),
  ]);

  const backlinks = siblings.map((s) =>
    el("a", { class: "backlink", href: "#" + s.siteId }, ["also cited in " + s.context])
  );

  const detail = el("div", {
    id: detailId, class: "citation-detail", hidden: "",
    role: "group", "aria-label": "Citation detail for " + pinId,
  }, [dl, ...backlinks]);

  return el("div", null, [button, detail]);
}

/* Every numeric render carries the field's own citation pin, independent of
   whatever source-fact citationSites the model happens to list. A
   computed_zero or closure_backed_zero line has no source-fact pins to cite
   (there is nothing to point at, by definition), but it still names a
   citation on its own field, and ADR-0046 Requirement 1 admits no numeric
   value onto the page without one (F1: numeric zero lines were reaching the
   DOM with an empty citationSites array and no fallback to field.citation). */
function renderFieldCitation(siteId, field) {
  const citation = field.citation;
  if (!citation || !citation.id || !citation.version) {
    throw new SectionError("missing-field-citation");
  }
  return renderCitation(siteId, citation.id, citation.version);
}

const LINE21_USED_KINDS = Object.freeze(["plain-case", "older-yes-cover", "older-method", "nothing"]);
const LINE21_SUPPORT_RULE = "tax.us.2025.rule.sli-statement-loan-support";
const LINE21_COMBINED_RULE = "tax.us.2025.rule.sli-statement-combined-standing";
const LINE21_OLDER_VALUES = Object.freeze(["yes", "no", "absent", "unreadable"]);
const LINE21_OLDER_SOURCE = "tax.us.2025.f1098e.no-non-qualified-loan-component";
const LINE21_SUPPORT_BOX = "Box 1 holds no loan the person did not record";
const LINE21_NOT_USED = "Recorded, not used.";
const LINE21_DENIAL = "tax.us.2025.sli.statement-inclusion-denied";
const LINE21_DENIAL_PROPOSITION = "This form does not include that borrowing.";
const LINE21_WITNESS = Object.freeze([
  "tax.us.2025.f1098e.box1-student-loan-interest",
  "tax.us.2025.f1098e.box2-checked-authority",
]);
const LINE21_USED_SENTENCE = Object.freeze({
  "plain-case": "The calculation used the newer detail on this form.",
  "older-yes-cover": "The calculation used the older yes to cover a matter the detail left open, withdrew, or denied.",
  "older-method": "The calculation used the older method alone.",
  "nothing": "The calculation used nothing for this form. The reason is named above.",
});
const LINE21_PLAIN_RESPONSE = Object.freeze({
  "yes": "yes",
  "no": "no",
  "cannot-tell": "cannot tell",
  "sli.financing.affirmed": "affirmed",
  "sli.financing.denied": "denied",
  "sli.financing.withdrawn": "withdrawn",
  "sli.financing.unresolved": "unresolved",
  "sli.statement-inclusion.affirmed": "affirmed",
  "sli.statement-inclusion.denied": "denied",
  "sli.statement-inclusion.withdrawn": "withdrawn",
  "sli.statement-inclusion.unresolved": "unresolved",
  "sli.statement-inclusion.scope-unresolved": "unresolved about which loan",
});

function line21Fail() {
  throw new SectionError("malformed-line21-explanation");
}

function line21NonEmpty(value) {
  return typeof value === "string" && value.length > 0;
}

function line21PlainResponse(value) {
  const plain = LINE21_PLAIN_RESPONSE[value];
  if (!plain) line21Fail();
  return plain;
}

function validateLine21Account(row) {
  if (row.account === undefined && row.statementKeys === undefined) return;
  const keys = row.statementKeys;
  if (!keys || !line21NonEmpty(keys.lender) || !line21NonEmpty(keys.statement) || !line21NonEmpty(keys.taxYear)) line21Fail();
  const account = row.account;
  if (!account) line21Fail();
  const said = account.said;
  const used = account.used;
  const recorded = account.recordedNotUsed;
  if (!said || !used || !Array.isArray(recorded)) line21Fail();
  const older = said.olderAnswer;
  if (!older || !LINE21_OLDER_VALUES.includes(older.value) || !line21NonEmpty(older.findingId) ||
      !["current", "history", "absent"].includes(older.currency)) line21Fail();
  if (older.currency === "absent") {
    if (older.sourceFindingId !== undefined || older.sourceFactType !== undefined) line21Fail();
  } else if (!line21NonEmpty(older.sourceFindingId) || older.sourceFactType !== LINE21_OLDER_SOURCE ||
             older.sourceFindingId === older.findingId) {
    line21Fail();
  }
  for (const listName of ["current", "history"]) {
    const items = said[listName];
    if (!Array.isArray(items)) line21Fail();
    for (const item of items) {
      if (!item || !line21NonEmpty(item.findingId) || !line21NonEmpty(item.factType) || !line21NonEmpty(item.response)) line21Fail();
      if (LINE21_WITNESS.includes(item.factType)) line21Fail();
      if (item.proposition !== undefined && !line21NonEmpty(item.proposition)) line21Fail();
      if (item.factType === LINE21_DENIAL && item.proposition !== LINE21_DENIAL_PROPOSITION) line21Fail();
      line21PlainResponse(item.response);
    }
  }
  if (!LINE21_USED_KINDS.includes(used.kind) || !line21NonEmpty(used.combined) || !line21NonEmpty(used.combinedFindingId)) line21Fail();
  for (const item of recorded) {
    if (!item || !line21NonEmpty(item.findingId) || typeof item.text !== "string" ||
        !item.text.startsWith(LINE21_NOT_USED) || item.text.includes("replaced") || item.text.includes("tax.us.")) {
      line21Fail();
    }
  }
  const basis = row.basis;
  if (used.kind === "nothing") {
    if (basis !== undefined) line21Fail();
    if (row.support === "plain-case-supported" && recorded.length === 0) line21Fail();
  } else if (used.kind === "plain-case") {
    if (!basis || basis.ruleId !== LINE21_SUPPORT_RULE || basis.standsInFor !== undefined) line21Fail();
  } else if (!basis || basis.ruleId !== LINE21_COMBINED_RULE || !Array.isArray(basis.standsInFor) ||
             !basis.standsInFor.length || !basis.standsInFor.every(line21NonEmpty)) {
    line21Fail();
  } else if (used.kind === "older-method") {
    if (basis.standsInFor.some((sentence) => sentence.includes("stands in for")) ||
        !basis.standsInFor.some((sentence) => sentence.includes("is the method"))) line21Fail();
  } else if (!basis.standsInFor.every((sentence) => sentence.includes("stands in for"))) {
    line21Fail();
  }
  if (basis && Array.isArray(basis.assumed) && used.kind !== "plain-case" &&
      basis.assumed.some((sentence) => typeof sentence === "string" && sentence.includes(LINE21_SUPPORT_BOX))) {
    line21Fail();
  }
  if (older.value === "yes" && (used.kind === "plain-case" || used.kind === "nothing") &&
      !recorded.some((item) => item.findingId === older.findingId)) {
    line21Fail();
  }
}

function line21AnswerText(item) {
  const proposition = item.proposition ? item.proposition + " " : "";
  return proposition + "Recorded answer: " + line21PlainResponse(item.response) + ".";
}

function renderLine21Account(row) {
  const account = row.account;
  const said = account.said;
  const older = said.olderAnswer;
  const saidItems = [];
  if (older.currency === "absent") {
    saidItems.push(el("li", null, ["Older answer about this form's box 1: absent. No older answer was recorded."]));
  } else {
    saidItems.push(el("li", null, [
      "Older answer about this form's box 1: " + older.value + ". Currency: " + older.currency + ".",
    ]));
  }
  for (const item of said.current) saidItems.push(el("li", null, ["Current. " + line21AnswerText(item)]));
  for (const item of said.history) saidItems.push(el("li", null, ["History, not current. " + line21AnswerText(item)]));
  const usedItems = [el("li", null, [LINE21_USED_SENTENCE[account.used.kind]])];
  if (row.basis && Array.isArray(row.basis.standsInFor)) {
    for (const sentence of row.basis.standsInFor) usedItems.push(el("li", null, [sentence]));
  }
  usedItems.push(el("li", null, ["Combined class: " + account.used.combined + "."]));
  const assumedItems = [];
  if (account.used.kind === "nothing") {
    assumedItems.push(el("li", null, ["Nothing favorable is assumed. The reason is named above."]));
  } else if (row.basis) {
    const seen = new Set();
    for (const sentence of row.basis.assumed) {
      if (!seen.has(sentence)) {
        seen.add(sentence);
        assumedItems.push(el("li", null, [sentence]));
      }
    }
    for (const sentence of row.basis.standsInFor || []) {
      if (!seen.has(sentence)) {
        seen.add(sentence);
        assumedItems.push(el("li", null, [sentence]));
      }
    }
    for (const sentence of row.basis.leftWithPerson) assumedItems.push(el("li", null, ["Left with you: " + sentence]));
  }
  const recordedItems = account.recordedNotUsed.length
    ? account.recordedNotUsed.map((item) => el("li", null, [item.text]))
    : [el("li", null, ["None."])];
  const groups = el("div", { class: "line21-account-groups" }, [
    line21Group("What the person said", saidItems),
    line21Group("What the calculation used", usedItems),
    line21Group("What it assumed", assumedItems),
    line21Group("Recorded, not used", recordedItems),
  ]);
  return el("details", { class: "line21-account", open: "" }, [
    el("summary", null, ["What this form accounts for"]),
    groups,
  ]);
}

function validateLine21Explanation(block) {
  if (!block || block.schema !== "line21-explanation.v1" || typeof block.runId !== "string" ||
      !Number.isInteger(block.workspaceRevision) || !Array.isArray(block.rows) || block.rows.length === 0) {
    throw new SectionError("malformed-line21-explanation");
  }
  for (const row of block.rows) {
    if (!row || !row.statementLabel || typeof row.statementLabel !== "object" || !Array.isArray(row.loans) ||
        !row.loans.every((loan) => typeof loan === "string") || !row.status ||
        !["no-reason", "named-by-reason"].includes(row.status.kind)) {
      throw new SectionError("malformed-line21-explanation");
    }
    if (row.amount !== undefined && (typeof row.amount !== "number" || !Number.isFinite(row.amount))) {
      throw new SectionError("malformed-line21-explanation");
    }
    if (row.status.kind === "named-by-reason" && (!Array.isArray(row.status.reasonIndices) || !row.status.reasonIndices.length ||
        !row.status.reasonIndices.every(Number.isInteger))) throw new SectionError("malformed-line21-explanation");
    if (row.basis !== undefined) {
      const basis = row.basis;
      if (!basis || typeof basis.ruleId !== "string" || !Array.isArray(basis.answers) ||
          !Array.isArray(basis.assumed) || !Array.isArray(basis.leftWithPerson)) throw new SectionError("malformed-line21-explanation");
      for (const answer of basis.answers) {
        if (!answer || typeof answer.findingId !== "string" || typeof answer.factType !== "string" ||
            typeof answer.response !== "string" || (answer.proposition !== undefined &&
            (typeof answer.proposition !== "string" || !answer.proposition))) throw new SectionError("malformed-line21-explanation");
      }
    }
    validateLine21Account(row);
  }
  if (block.working !== undefined && (!block.working || typeof block.working.lineOneSubtotal !== "number" ||
      typeof block.working.value !== "number" || !Array.isArray(block.working.parameters))) {
    throw new SectionError("malformed-line21-explanation");
  }
}

function renderLine21Explanation(container, section, block) {
  validateLine21Explanation(block);
  const root = el("div", { class: "line21-explanation", "data-line21-explanation": "true" }, []);
  root.appendChild(el("h3", null, ["Statements on this line"]));
  const rows = el("div", { class: "line21-rows" }, []);
  for (const row of block.rows) {
    const card = el("article", { class: "line21-row" }, []);
    const label = [row.statementLabel.statement, row.statementLabel.lender, row.statementLabel.taxYear]
      .filter((part) => typeof part === "string" && part).join(", ");
    card.appendChild(el("p", null, [el("strong", null, [label || "Statement"])]));
    for (const loan of row.loans) card.appendChild(el("p", null, ["loan: " + loan]));
    if (row.amount !== undefined) {
      const amountText = row.account
        ? "Form 1098-E box 1: " + String(row.amount)
        : String(row.amount) + " reported";
      card.appendChild(el("p", null, [amountText]));
    }
    if (row.status.kind === "named-by-reason") {
      for (const index of row.status.reasonIndices) {
        const reason = (section.resolved.reasons || [])[index];
        if (!reason) throw new SectionError("malformed-line21-explanation");
        card.appendChild(el("p", null, [el("a", { href: "#line21-reason-" + index }, ["See the reason above"])]));
      }
    }
    if (row.account) card.appendChild(renderLine21Account(row));
    else if (row.basis) {
      const detail = el("details", { class: "line21-detail" }, [el("summary", null, ["What this statement's loan link rests on"])]);
      const groups = el("div", { class: "line21-groups" }, []);
      const answers = row.basis.answers.map((answer) => {
        const text = answer.proposition
          ? answer.proposition + " Recorded answer: " + answer.response + "."
          : "Recorded answer: " + answer.response + ". Question wording was not saved with this answer.";
        return el("li", null, [text]);
      });
      groups.appendChild(line21Group("What you told us", answers));
      groups.appendChild(line21Group("What the application took as given", row.basis.assumed.map((text) => el("li", null, [text]))));
      groups.appendChild(line21Group("Conditions left with you", row.basis.leftWithPerson.map((text) => el("li", null, [text]))));
      detail.appendChild(groups);
      card.appendChild(detail);
    }
    rows.appendChild(card);
  }
  root.appendChild(rows);
  if (block.working) {
    const working = el("details", { class: "line21-working" }, [el("summary", null, ["How the amount was worked out"])]);
    working.appendChild(el("p", null, ["Interest reported (worksheet line 1): " + block.working.lineOneSubtotal]));
    if (block.working.totalIncome !== undefined) working.appendChild(el("p", null, ["Income the worksheet used: " + block.working.totalIncome]));
    for (const parameter of block.working.parameters) {
      if (!parameter || typeof parameter.id !== "string" || typeof parameter.version !== "string" ||
          (typeof parameter.value !== "string" && typeof parameter.value !== "number")) throw new SectionError("malformed-line21-explanation");
      working.appendChild(el("p", null, ["Limit " + (parameter.label || parameter.title || parameter.id) + ": " + parameter.value]));
    }
    working.appendChild(el("p", null, ["Deduction: " + block.working.value]));
    if (block.working.parameters.length) working.appendChild(el("p", null, ["This page does not say which of these limits changed the amount."]));
    root.appendChild(working);
  }
  root.appendChild(el("p", { class: "line21-run" }, ["This explanation describes run " + block.runId +
    ", which read workspace revision " + block.workspaceRevision + ". Later changes to the workspace are not reflected here."]));
  container.appendChild(root);
}

function line21Group(title, items) {
  return el("div", { class: "line21-group" }, [el("h4", null, [title]), el("ul", null, items)]);
}

function renderLine21Citations(container, section, field, hasBlock) {
  if (!hasBlock) {
    if (NUMERIC_DISPOSITIONS.has(section.resolved.disposition)) {
      for (const site of section.citationSites || []) container.appendChild(renderCitation(site.siteId, site.pinId, site.pinVersion));
      container.appendChild(renderFieldCitation(fieldCitationSiteId(section.id), field));
    }
    return;
  }
  const sites = section.citationSites || [];
  const citations = sites.map((site) => renderCitation(site.siteId, site.pinId, site.pinVersion));
  const disposition = section.resolved.disposition;
  if (NUMERIC_DISPOSITIONS.has(disposition)) citations.push(renderFieldCitation(fieldCitationSiteId(section.id), field));
  if (!citations.length) return;
  const detail = el("details", { class: "line21-citations" }, [el("summary", null, ["All records this line depends on (" + citations.length + ")"]), ...citations]);
  container.appendChild(detail);
}

document.addEventListener("click", (evt) => {
  const btn = evt.target.closest("button.citation");
  if (!btn) return;
  const detail = document.getElementById(btn.getAttribute("aria-controls"));
  const expanded = btn.getAttribute("aria-expanded") === "true";
  btn.setAttribute("aria-expanded", String(!expanded));
  if (detail) detail.hidden = expanded;
});

/* ============================================================
   Per-line rendering. Each disposition kind has exactly one
   render path here, called only from this function — a single
   citation/render-path binding, not one per call site.
   ============================================================ */
function renderLine(container, section) {
  const field = section.field;
  const resolved = section.resolved;
  const disposition = resolved.disposition;
  const isLine21 = section.id === "line-sch1-21";
  const hasLine21Block = isLine21 && MODEL.line21Explanation !== undefined;
  const instructionKey = disposition === "published_categorical" ? "published_value" : disposition;
  const instruction = field.dispositions ? field.dispositions[instructionKey] : undefined;

  if (!Object.prototype.hasOwnProperty.call(field.dispositions || {}, instructionKey)) {
    throw new SectionError("unrecognized-disposition");
  }
  if (!instruction) throw new SectionError("missing-instruction");

  container.appendChild(el("h2", null, [
    field.label + " (Line " + field.line + ") ",
    el("span", { class: "badge " + disposition }, [disposition.replace(/_/g, " ")]),
  ]));

  if (NUMERIC_DISPOSITIONS.has(disposition)) {
    const value = resolved.value;
    if (typeof value !== "number" || !Number.isFinite(value)) {
      throw new SectionError("invalid-numeric-value");
    }
    const text = instruction.render === "{value}" ? String(value) : instruction.render;
    container.appendChild(el("p", { class: "line-value" }, [text]));
    container.appendChild(el("p", { class: "explain" }, [instruction.explain]));
    if (hasLine21Block) {
      renderLine21Explanation(container, section, MODEL.line21Explanation);
      renderLine21Citations(container, section, field, true);
    } else renderLine21Citations(container, section, field, false);
    return;
  }

  if (disposition === "published_categorical") {
    // The declared field instruction is the only affirmative display source.
    // Never read resolved.act.finding.value: categorical source values remain
    // redacted even if a malformed model tries to smuggle one alongside it.
    if (instruction.render !== "checked") throw new SectionError("missing-instruction");
    container.appendChild(el("p", { class: "line-value", role: "status", "aria-label": field.label + ": checked" }, ["checked"]));
    container.appendChild(el("p", { class: "explain" }, [instruction.explain]));
    container.appendChild(renderFieldCitation(fieldCitationSiteId(section.id), field));
    return;
  }

  if (disposition === "blocked") {
    // Deliberately never reads resolved.value: a blocked line has nothing
    // published, and no field on the resolved record can override that
    // (ADR-0046 foreclosure 1/2 — zero-authority holds even under a
    // smuggled numeric field on the same object).
    container.classList.add("blocked-line");
    const codes = Array.isArray(resolved.activeCodes) ? resolved.activeCodes : [];
    const knownCodes = new Set(instruction.codes || []);
    const shownCodes = codes.filter((c) => knownCodes.has(c));
    // Reasons the projector copied from declared content, one per statement
    // it names. Rendered as text only; a malformed entry is an error.
    const reasons = Array.isArray(resolved.reasons) ? resolved.reasons : [];
    const items = reasons.map((reason, index) => {
      if (!reason || typeof reason.sentence !== "string" || !reason.sentence) {
        throw new SectionError("malformed-blocked-reason");
      }
      const label = reason.statementLabel || {};
      const name = [label.statement, label.lender].filter((part) => typeof part === "string" && part).join(", ");
      return el("li", { id: isLine21 ? "line21-reason-" + index : undefined }, name ? [el("strong", null, [name + ": "]), reason.sentence] : [reason.sentence]);
    });
    // When the line says why it is blocked, that is its explanation: the
    // field's generic blocked sentence and the generic remedy would
    // contradict it (a person who answered "no" is not missing anything),
    // so neither is shown on this line. Lines without reasons keep both.
    container.appendChild(el("div", { class: "blocked-banner", role: "alert" }, [
      el("div", null, [
        el("p", { class: "line-value blocked-value" }, ["No value published — cannot compute."]),
        ...(items.length ? [] : [el("p", null, [instruction.explain])]),
        ...(isLine21 && items.length ? [] : [el("p", null, [
          el("strong", null, ["Missing dependency code(s): "]),
          shownCodes.length ? shownCodes.join(", ") : "(unspecified)",
        ])]),
      ]),
    ]));
    if (items.length) {
      container.appendChild(el("div", { class: "blocked-reasons" }, [
        el("p", null, [el("strong", null, ["Why: "])]),
        el("ul", null, items),
      ]));
      if (hasLine21Block) {
        renderLine21Explanation(container, section, MODEL.line21Explanation);
        renderLine21Citations(container, section, field, true);
      } else renderLine21Citations(container, section, field, false);
      return;
    }
    container.appendChild(el("div", { class: "remedy-box" }, [
      el("strong", null, ["Remedy: "]),
      "contribute the missing dependency to unblock this line.",
    ]));
    if (hasLine21Block) {
      renderLine21Explanation(container, section, MODEL.line21Explanation);
      renderLine21Citations(container, section, field, true);
    } else renderLine21Citations(container, section, field, false);
    return;
  }

  if (disposition === "guard_inapplicable") {
    container.appendChild(el("p", { class: "line-value guard-value" }, ["Not applicable."]));
    container.appendChild(el("p", { class: "explain" }, [instruction.explain]));
    return;
  }

  throw new SectionError("unrecognized-disposition");
}

/* ADR-0056: an attachment's own three-state disposition (published,
   blocked, not-required), adapted from renderLine's blocked/
   guard_inapplicable branches - not called directly, since an attachment
   has no field.dispositions vocabulary to read explain text or a known-code
   allowlist from. Both live here as renderer-owned declared constants
   instead (ADR-0056 Decision 3): the attachment ontology has no
   per-schedule content surface for this text, and this ADR does not add
   one. resolved.activeCodes is filtered through the closed three-code
   allowlist before display; any other code is a rendering error, never
   shown verbatim. */
const ATTACHMENT_EXPLAIN = Object.freeze({
  published: "This attachment is required and complete.",
  blocked: "This attachment is required, but is incomplete: a required condition is missing or violated.",
  guard_inapplicable: "This attachment is not required for this return.",
});

const ATTACHMENT_KNOWN_CODES = new Set([
  "DEPENDENCY_ABSENT",
  "ITEMIZATION_TIE_OUT_VIOLATION",
  "COMPLETENESS_VALUE_VIOLATION",
]);

function renderAttachmentStatus(container, attachment) {
  const resolved = attachment.resolved;
  const disposition = resolved.disposition;
  const explain = ATTACHMENT_EXPLAIN[disposition];
  if (!explain) throw new SectionError("unrecognized-disposition");

  container.appendChild(el("h2", null, [
    attachment.title + " ",
    el("span", { class: "badge " + disposition }, [disposition.replace(/_/g, " ")]),
  ]));

  if (disposition === "published") {
    container.appendChild(el("p", { class: "explain" }, [explain]));
    return;
  }

  if (disposition === "blocked") {
    container.classList.add("blocked-line");
    const codes = Array.isArray(resolved.activeCodes) ? resolved.activeCodes : [];
    const shownCodes = [];
    for (const code of codes) {
      if (!ATTACHMENT_KNOWN_CODES.has(code)) throw new SectionError("unrecognized-attachment-code");
      shownCodes.push(code);
    }
    container.appendChild(el("div", { class: "blocked-banner", role: "alert" }, [
      el("div", null, [
        el("p", { class: "line-value blocked-value" }, ["Not shown — required and incomplete."]),
        el("p", null, [explain]),
        el("p", null, [
          el("strong", null, ["Missing or violated condition code(s): "]),
          shownCodes.length ? shownCodes.join(", ") : "(unspecified)",
        ]),
      ]),
    ]));
    container.appendChild(el("div", { class: "remedy-box" }, [
      el("strong", null, ["Remedy: "]),
      "contribute or correct the missing or violated condition to complete this attachment.",
    ]));
    return;
  }

  if (disposition === "guard_inapplicable") {
    container.appendChild(el("p", { class: "line-value guard-value" }, ["Not required."]));
    container.appendChild(el("p", { class: "explain" }, [explain]));
    return;
  }

  throw new SectionError("unrecognized-disposition");
}

function renderCitationGroup(container, group) {
  container.appendChild(el("h2", null, [group.title]));
  for (const part of group.parts || []) {
    container.appendChild(el("h3", null, [part.heading]));
    const wrap = el("div", null, []);
    for (const site of part.citationSites || []) {
      wrap.appendChild(renderCitation(site.siteId, site.pinId, site.pinVersion));
    }
    if (part.tieOutText) wrap.appendChild(el("p", { class: "explain" }, [part.tieOutText]));
    container.appendChild(wrap);
  }
}

/* Diagnostic/derived-value lines are rendered ONLY when every input line
   they tie out resolved to an actual published number. This is the
   zero-authority side-channel ADR-0046 forecloses explicitly: a tie-out
   number is a rendered claim like any other, so it must disappear the
   instant any of its inputs is blocked or inapplicable — never fall back
   to a stale, partial, or fabricated figure. */
function healthyDisposition(sectionId) {
  const section = (MODEL.sections || []).find((s) => s.id === sectionId);
  if (!section || !NUMERIC_DISPOSITIONS.has(section.resolved.disposition)) return false;
  const value = section.resolved.value;
  return typeof value === "number" && Number.isFinite(value);
}

function renderDiagnostic(container, diag) {
  const healthy = (diag.inputs || []).every(healthyDisposition);
  const box = el("div", { id: diag.id, class: "diagnostic" + (healthy ? "" : " suppressed") }, []);
  box.appendChild(el("strong", null, [diag.label + ": "]));
  box.appendChild(el("span", null, [
    healthy ? diag.renderText : "Not shown — computed from a blocked or inapplicable input.",
  ]));
  container.appendChild(box);
}

/* Blast containment: every top-level unit renders in total isolation.
   A thrown error is caught here and turns into a visible, on-page error
   banner scoped to that unit's own DOM node only — never any other
   unit's node, and never a page-wide failure. */
function renderSafely(elementId, renderFn, arg, label) {
  const container = document.getElementById(elementId);
  const unit = el("section", { class: "line" }, []);
  try {
    renderFn(unit, arg);
  } catch (err) {
    while (unit.firstChild) unit.removeChild(unit.firstChild);
    const reasonCode = err instanceof SectionError ? err.reasonCode : "unknown-error";
    unit.appendChild(el("h2", null, [label]));
    unit.appendChild(el("div", { class: "section-error", role: "alert" }, [REASON_TEXT[reasonCode]]));
  }
  container.appendChild(unit);
}

const sectionsRoot = document.getElementById("sections-root");
for (const section of MODEL.sections || []) {
  const wrap = el("div", { id: section.id }, []);
  sectionsRoot.appendChild(wrap);
  renderSafely(section.id, renderLine, section, (section.field && section.field.label) || section.id);
}

const attachmentStatusRoot = document.getElementById("attachment-status-root");
for (const attachment of MODEL.attachments || []) {
  const statusId = attachment.id + "-status";
  const wrap = el("div", { id: statusId }, []);
  attachmentStatusRoot.appendChild(wrap);
  renderSafely(statusId, renderAttachmentStatus, attachment, attachment.title || attachment.id);
}

const groupsRoot = document.getElementById("citation-groups-root");
for (const group of MODEL.citationGroups || []) {
  const wrap = el("div", { id: group.id }, []);
  groupsRoot.appendChild(wrap);
  renderSafely(group.id, renderCitationGroup, group, group.title || group.id);
}

const diagnosticsRoot = document.getElementById("diagnostics-root");
for (const diag of MODEL.diagnostics || []) {
  renderDiagnostic(diagnosticsRoot, diag);
}
</script>
</body>
</html>
