[pytest]
# The test suite is authored as unittest.TestCase; pytest is adopted only as a
# faster *runner*, not a test-authoring change. `-n auto` runs across all cores
# (pytest-xdist). Measured 2026-07-25: 590 tests, 129s serial -> 26s at -n auto
# on 10 cores, all passing (no parallel-safety collisions).
#
# Keep `-n auto` even for a single module: measured 2026-08-16, three modules
# (38 tests) run 5.5s at -n auto against 32.7s serial. xdist startup is never
# the thing to economize on here.
#
# `--dist worksteal` measured once each on the Track 1 commit before this setting: wall 510.54s to
# 426.43s, user+system 3601.47s to 3487.73s, both runs 3157 passed. The wall
# drop is workers not sitting out the long tail. It is not less CPU.
testpaths = tests
addopts = -n auto --dist worksteal

# Lane routing lives in tests/conftest.py, which applies `live` by inspecting
# the module rather than by hand. See AGENTS.md ("Test lanes") for when the
# fast lane is and is not an acceptable substitute for the full suite.
markers =
    live: drives the real coordinator (live_coordinate_run) or regenerates goldens; slow integration
