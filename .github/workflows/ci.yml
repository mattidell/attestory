name: verify

# The authoritative gate. Runs the same quartet the role charters use, so a
# green check on a commit is a tamper-resistant fact roles can reference instead
# of re-running (AGENTS.md "Test economy"). Required for merge via branch
# protection on main.
#
# Both continuous lines are gated. `main-ui` was added 2026-07-30 after the
# Legible Entry phase ran three milestones on it with no check ever firing:
# every charter on that line required a green `verify` that could not run, so
# "green" meant a self-report, which AGENTS.md says is not a substitute for the
# check. Adding a branch here is not enough on its own -- branch protection must
# also require the check on `main-ui`, or it reports without blocking.
#
# Two jobs. `quick` runs the cheap checks and the fast lane on every push,
# drafts included, so a type, lint, data-boundary or fast-lane failure reports
# in about a minute. `verify` is the full gate and the required check.
#
# On a draft PR, `verify` fails at its first step without running the suite. It
# must fail rather than be skipped: a skipped job is a success, and a skipped
# required check would let a head pass that never ran the suite. The
# `ready_for_review` event runs `verify` in full on the head being marked
# ready, and every later push to a ready PR runs it again.
#
# `verify` stays self-contained (cheap checks plus the full suite) rather than
# depending on `quick`, for the same reason: a job skipped because a
# dependency failed reports as skipped.
on:
  pull_request:
    branches: [main, main-ui]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, main-ui]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # envelope_scan diffs against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ADR-0031 envelope git hooks (a proper clone has these)
        run: python3 tools/install_envelope_hooks.py

      - name: Types (mypy)
        run: python -m mypy

      - name: Governance lint
        run: python tools/governance_lint.py

      - name: Data-boundary scan (envelope_scan)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          python tools/envelope_scan.py --range "$BASE..HEAD"

      - name: Fast lane (pytest -m "not live")
        run: python -m pytest -m "not live"

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Draft PRs do not run the full gate
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "Draft PR: the full suite has not run on this head. Mark the PR ready for review to run verify."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # envelope_scan diffs against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ADR-0031 envelope git hooks (a proper clone has these)
        run: python3 tools/install_envelope_hooks.py

      - name: Types (mypy)
        run: python -m mypy

      - name: Governance lint
        run: python tools/governance_lint.py

      - name: Data-boundary scan (envelope_scan)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          python tools/envelope_scan.py --range "$BASE..HEAD"

      - name: Tests (pytest -n auto)
        run: pytest --junitxml=test-results/pytest.xml --durations=50

      - name: Publish per-test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-durations
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 30
