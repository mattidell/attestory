name: verify

# Required merge check for main and main-ui. The check context is the job id
# `verify`. Classic branch protection treats a skipped job as success, so a
# failed or skipped dependency must not skip this job: it uses `if: always()`
# and exits non-zero unless the cheap checks and every shard succeeded.
# Drafts fail in the first step and do not start the suite. A cancelled run
# is not a success. Push and ready_for_review are full-gate events.
#
# The suite is the same collection as one pytest process, packed into four
# runners. No marker filter is added. quick still runs the fast lane on
# drafts and on ready pulls.

on:
  pull_request:
    branches: [main, main-ui]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, main-ui]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # envelope_scan diffs against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ADR-0031 envelope git hooks (a proper clone has these)
        run: python3 tools/install_envelope_hooks.py

      - name: Types (mypy)
        run: python -m mypy

      - name: Governance lint
        run: python tools/governance_lint.py

      - name: Data-boundary scan (envelope_scan)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          python tools/envelope_scan.py --range "$BASE..HEAD"

      - name: Fast lane (pytest -m "not live")
        run: python -m pytest -m "not live"

  precheck:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # envelope_scan diffs against the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ADR-0031 envelope git hooks (a proper clone has these)
        run: python3 tools/install_envelope_hooks.py

      - name: Types (mypy)
        run: python -m mypy

      - name: Governance lint
        run: python tools/governance_lint.py

      - name: Data-boundary scan (envelope_scan)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD~1)"
          fi
          python tools/envelope_scan.py --range "$BASE..HEAD"

  suite-shard:
    needs: precheck
    if: ${{ !cancelled() && needs.precheck.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each shard is its own checkout. precheck's hooks are not in this clone.
      - name: Install ADR-0031 envelope git hooks (a proper clone has these)
        run: python3 tools/install_envelope_hooks.py

      # Pin the historical test's ref to the event-specific baseline and
      # compare its bytes before the suite; the test itself can skip.
      - name: Prepare historical baseline before the suite
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_AFTER_SHA: ${{ github.event.after }}
        run: python3 -m tools.ci_historical_ref prepare

      - name: Run one full-suite shard
        env:
          DEMO_CHROME_TRACE: test-results/chrome-startup.jsonl
        run: |
          mkdir -p test-results
          python3 -m tools.ci_gate run-shard --index ${{ matrix.shard }} --count 4 --durations docs/phases/engineering-health/milestones/test-cost-remaining-evidence/ci-node-durations.json --results-dir test-results

      - name: Observe isolated and parallel Chrome startup
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        run: node tools/presentation_harness/chrome-startup-probe.mjs test-results/chrome-probe.jsonl

      - name: Publish shard durations and CPU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-durations-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: [precheck, suite-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Draft PRs do not run the full gate
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "Draft PR: the full suite has not run on this head. Mark the PR ready for review to run verify."
          exit 1

      - uses: actions/checkout@v4

      - name: Require successful cheap checks and shards
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 -m tools.ci_gate prerequisites --needs-json "$CI_NEEDS_JSON" --event-name "$CI_EVENT_NAME" --draft "$CI_DRAFT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-durations-shard-*
          path: ci-shard-artifacts

      - name: Prove each collected test ran once
        run: python3 -m tools.ci_gate coverage --artifacts ci-shard-artifacts --shard-count 4
